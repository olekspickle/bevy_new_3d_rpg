[toolchain]

# Kept in sync with `env.toolchain` in .github/workflows/ci.yaml — a mismatch here overrides
# CI's pinned, per-job toolchain install once cargo runs inside this checked-out repo, silently
# falling back to a rustup auto-install of plain "nightly" missing whatever components below
# don't list, breaking fmt/clippy/docs/tests/web-build in CI all at once.
channel = "nightly-2026-08-29"
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "x86_64-pc-windows-gnu"
]
components = ["rustc", "cargo", "clippy", "rustfmt", "rust-src"]
