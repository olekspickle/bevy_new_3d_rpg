---
name: release

on:
  # Trigger this workflow on a manual workflow dispatch.
  workflow_dispatch:
    inputs:
      version:
        description: 'version in the form of v1.2.3'
        required: true
        type: string
      build_windows:
        description: "build for Windows (WARNING: very slow!)"
        default: true
        type: boolean
      build_macos:
        description: "build for macOS"
        default: true
        type: boolean
      build_linux:
        description: "build for Linux"
        default: true
        type: boolean
      build_web:
        description: "build for web"
        default: true
        type: boolean
      itch:
        description: "itch.io project (user/project)"
        type: string
      upload_to_github:
        description: "upload to GitHub releases"
        default: true
        type: boolean
      deploy_to_github_pages:
        description: "deploy web build to GitHub Pages"
        default: false
        type: boolean
      deny_warnings:
        description: "deny warnings"
        default: false
        type: boolean
  push:
    branches: [main]

# Cancel the release workflow when a more recent workflow begins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Must be the same as the main crate name for platform dependent builds
  pkg_name: bevy_new_3d_rpg

  # The itch.io project to deploy to in the format `user-name/project-name`.
  # There will be no deployment to itch.io if this is commented out.
  itch: olekspickle/bevy-3d-rpg

  # The path to the assets directory.
  assets_path: assets

  # The path to the libraries directory. Useful for vendoring libraries.
  # https://github.com/TheBevyFlock/bevy_new_2d/commit/0ef708b3a182223f78c60d378709667d5edc3ad4
  libs_path: lib

  # The ID of the app produced by this workflow.
  # Applies to macOS releases.
  # Must contain only A-Z, a-z, 0-9, hyphen, and period: https://developer.apple.com/documentation/bundleresources/information_property_list/cfbundleidentifier
  app_id: olekspickle.bevy-3d-rpg

  # The base filename of the binary in the package produced by this workflow.
  # Applies to Windows, macOS, and Linux releases.
  # Defaults to `pkg_name` if commented out.
  #app_binary_name: bevy_new_2d

  # The name of the `.zip` or `.dmg` file produced by this workflow.
  # Defaults to `app_binary_name` if commented out.
  app_package_name: bevy-3d-rpg

  # The display name of the app produced by this workflow.
  # Applies to macOS releases.
  # Defaults to `app_package_name` if commented out.
  app_display_name: Bevy 3D RPG

  # The short display name of the app produced by this workflow.
  # Applies to macOS releases.
  # Must be 15 or fewer characters: https://developer.apple.com/documentation/bundleresources/information_property_list/cfbundlename
  # Defaults to `app_display_name` if commented out.
  #app_short_name: Bevy 3D RPG

  # Before enabling LFS, please take a look at GitHub's documentation for costs and quota limits:
  # https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-storage-and-bandwidth-usage
  git_lfs: false

  # This is most useful in combination with
  use_github_cache: true

  # Enable these to deploy on every push to `main`.
  # Make sure to set up any enabled targets (e.g. the `BUTLER_API_KEY` secret for itch.io).
  # Warning: if you use private repositories, this will eat through your available worker minutes quickly.
  deploy_itch: true
  deploy_gh_pages: false

  toolchain: nightly-2026-08-29

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        # Use the input from workflow dispatch, or fall back to the Cargo.toml version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cargo pkgid | sed 's/.*#//')" >> "$GITHUB_OUTPUT"
          fi

  # Forward some environment variables as outputs of this job.
  # This is needed because the `env` context can't be used in the `if:` condition of a job:
  # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
  # Also unify inputs from workflow and tag pushes
  forward-env:
    runs-on: ubuntu-latest
    steps:
      - name: Set workflow_dispatch inputs and static toggles as outputs
        id: set-outputs
        # `inputs.*` are only populated for workflow_dispatch runs; on a push to `main` they're
        # empty, meaning full per-platform binary builds, GitHub-release uploads, and
        # deny-warnings all stay manual-dispatch-only. A push to `main` can still auto-build and
        # deploy the *web* build to itch.io/GitHub Pages, gated by the static `deploy_itch`/
        # `deploy_gh_pages` toggles above (which aren't dispatch inputs, just repo-owner config).
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
          echo "build_macos=${{ github.event.inputs.build_macos }}" >> $GITHUB_OUTPUT
          echo "build_linux=${{ github.event.inputs.build_linux }}" >> $GITHUB_OUTPUT
          echo "build_web=${{ github.event.inputs.build_web }}" >> $GITHUB_OUTPUT
          echo "itch=${{ github.event.inputs.itch || env.itch }}" >> $GITHUB_OUTPUT
          echo "upload_to_github=${{ github.event.inputs.upload_to_github }}" >> $GITHUB_OUTPUT
          echo "deny_warnings=${{ github.event.inputs.deny_warnings }}" >> $GITHUB_OUTPUT
          echo "deploy_itch=${{ env.deploy_itch }}" >> $GITHUB_OUTPUT
          echo "deploy_gh_pages=${{ env.deploy_gh_pages }}" >> $GITHUB_OUTPUT
    outputs:
      build_windows: ${{ steps.set-outputs.outputs.build_windows }}
      build_macos: ${{ steps.set-outputs.outputs.build_macos }}
      build_linux: ${{ steps.set-outputs.outputs.build_linux }}
      build_web: ${{ steps.set-outputs.outputs.build_web }}
      itch: ${{ steps.set-outputs.outputs.itch }}
      upload_to_github: ${{ steps.set-outputs.outputs.upload_to_github }}
      deny_warnings: ${{ steps.set-outputs.outputs.deny_warnings }}
      deploy_itch: ${{ steps.set-outputs.outputs.deploy_itch }}
      deploy_gh_pages: ${{ steps.set-outputs.outputs.deploy_gh_pages }}

# Build and package a release for each platform.
  build:
    needs:
      - get-version
      - forward-env
    env:
      version: ${{ needs.get-version.outputs.version }}
      # Avoid rate-limiting. See: <https://github.com/cargo-bins/cargo-binstall/issues/2045>.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - platform: web
            targets: wasm32-unknown-unknown
            package_ext: .zip
            features: web
            runner: ubuntu-latest

          - platform: linux
            targets: x86_64-unknown-linux-gnu
            package_ext: .zip
            features: native,third_person
            runner: ubuntu-latest

          - platform: windows
            targets: x86_64-pc-windows-msvc
            binary_ext: .exe
            package_ext: .zip
            features: native,third_person
            runner: windows-latest

          - platform: macos
            targets: x86_64-apple-darwin aarch64-apple-darwin
            app_suffix: .app/Contents/MacOS
            package_ext: .dmg
            features: native,third_person
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up environment
        run: |
          # Default values:
          echo "app_binary_name=${app_binary_name:=${{ env.pkg_name }}}" >> "${GITHUB_ENV}"
          echo "app_package_name=${app_package_name:=${app_binary_name}}" >> "${GITHUB_ENV}"
          echo "app_display_name=${app_display_name:=${app_package_name}}" >> "${GITHUB_ENV}"
          echo "app_short_name=${app_short_name:=${app_display_name}}" >> "${GITHUB_ENV}"

          # File paths:
          echo "app=tmp/app/${app_package_name}"'${{ matrix.app_suffix }}' >> "${GITHUB_ENV}"
          echo "package=${app_package_name}-"'${{ matrix.platform }}${{ matrix.package_ext }}' >> "${GITHUB_ENV}"

          # Rustflags:
          RUSTFLAGS='-Zthreads=0'
          if [ '${{ matrix.platform }}' != 'windows' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-Zshare-generics=y'
          fi
          # Set up platform library rpaths
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-C link-arg=-Wl,-rpath,$ORIGIN'
          fi
          if [ '${{ matrix.platform }}' = 'macos' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-C link-arg=-Wl,-rpath,@loader_path'
          fi
          if [ '${{ needs.forward-env.outputs.deny_warnings }}' = 'true' ]; then
            RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }"'-Dwarnings'
          fi
          echo "RUSTFLAGS=${RUSTFLAGS}" >> "${GITHUB_ENV}"


          # macOS environment:
          if [ '${{ matrix.platform }}' == 'macos' ]; then
            echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "${GITHUB_ENV}" # macOS 11.0 Big Sur is the first version to support universal binaries.
            echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "${GITHUB_ENV}"
          fi

          # Check if building for this platform is enabled.
          echo 'is_platform_enabled=${{
            (matrix.platform == 'web' && (needs.forward-env.outputs.build_web == 'true' || (github.event_name == 'push' && (needs.forward-env.outputs.deploy_itch == 'true' || needs.forward-env.outputs.deploy_gh_pages == 'true')))) ||
            (matrix.platform == 'linux' && needs.forward-env.outputs.build_linux == 'true') ||
            (matrix.platform == 'windows' && needs.forward-env.outputs.build_windows == 'true') ||
            (matrix.platform == 'macos' && needs.forward-env.outputs.build_macos == 'true')
          }}' >> "${GITHUB_ENV}"

      - name: Checkout repository
        if: ${{ env.is_platform_enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          lfs: ${{ env.git_lfs }}

      - name: Install Rust toolchain
        if: ${{ env.is_platform_enabled == 'true' }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.targets }}
          components: rust-src
          toolchain: ${{ env.toolchain }}

      - name: Restore Rust cache
        if: ${{ env.is_platform_enabled == 'true' && env.use_github_cache == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies (Linux)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform == 'linux' }}
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Prepare output directories
        if: ${{ env.is_platform_enabled == 'true' }}
        run: rm -rf tmp; mkdir -p tmp/binary '${{ env.app }}'

      - name: Install cargo-binstall
        if: ${{ env.is_platform_enabled == 'true' }}
        uses: cargo-bins/cargo-binstall@main

      - name: Install Bevy CLI
        if: ${{ env.is_platform_enabled == 'true' }}
        run: cargo binstall --locked -y --force --git=https://github.com/TheBevyFlock/bevy_cli bevy_cli

      - name: Build web bundle and add it to app (Web)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform == 'web' }}
        run: |
          cargo binstall --locked -y --force wasm-bindgen-cli
          cargo binstall --locked -y --force wasm-opt
          bevy build --locked --release --no-default-features --features='${{ matrix.features }}' --yes web --bundle
          mv 'target/bevy_web/web-release/${{ env.pkg_name }}' '${{ env.app }}'

      - name: Build binaries and add them to app (non-Web)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform != 'web' }}
        run: |
          for target in ${{ matrix.targets }}; do
            bevy build --locked --release --no-default-features --target="${target}" --features='${{ matrix.features }}'
            mv target/"${target}"/release/'${{ env.pkg_name }}${{ matrix.binary_ext }}' tmp/binary/"${target}"'${{ matrix.binary_ext }}'
          done
          if [ '${{ matrix.platform }}' == 'macos' ]; then
            lipo tmp/binary/*'${{ matrix.binary_ext }}' -create -output '${{ env.app }}/${{ env.app_binary_name }}${{ matrix.binary_ext }}'
          else
            mv tmp/binary/*'${{ matrix.binary_ext }}' '${{ env.app }}/${{ env.app_binary_name }}${{ matrix.binary_ext }}'
          fi

      - name: Add assets to app (non-Web)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform != 'web' }}
        run: cp -R ./'${{ env.assets_path }}' '${{ env.app }}' || true # Ignore error if assets folder does not exist

      - name: Add platform libraries (non-Web)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform != 'web' }}
        run: cp -R ./'${{ env.libs_path }}'/'${{ matrix.platform }}'/* '${{ env.app }}' || true

      - name: Add metadata to app (macOS)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform == 'macos' }}
        run: |
          cat >'${{ env.app }}/../Info.plist' <<EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
                <dict>
                    <key>CFBundleDevelopmentRegion</key>
                    <string>en</string>
                    <key>CFBundleDisplayName</key>
                    <string>${{ env.app_display_name }}</string>
                    <key>CFBundleExecutable</key>
                    <string>${{ env.app_binary_name }}</string>
                    <key>CFBundleIdentifier</key>
                    <string>${{ env.app_id }}</string>
                    <key>CFBundleName</key>
                    <string>${{ env.app_short_name }}</string>
                    <key>CFBundleShortVersionString</key>
                    <string>${{ env.version }}</string>
                    <key>CFBundleVersion</key>
                    <string>${{ env.version }}</string>
                    <key>CFBundleInfoDictionaryVersion</key>
                    <string>6.0</string>
                    <key>CFBundlePackageType</key>
                    <string>APPL</string>
                    <key>CFBundleSupportedPlatforms</key>
                    <array>
                        <string>MacOSX</string>
                    </array>
                </dict>
            </plist>
          EOF

      - name: Package app (non-Windows)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform != 'windows' }}
        working-directory: tmp/app
        run: |
          if [ '${{ matrix.platform }}' == 'macos' ]; then
            ln -s /Applications .
            hdiutil create -fs HFS+ -volname '${{ env.app_package_name }}' -srcfolder . '${{ env.package }}'
          else
            zip --recurse-paths '${{ env.package }}' '${{ env.app_package_name }}'
          fi

      - name: Package app (Windows)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform == 'windows' }}
        working-directory: tmp/app
        shell: pwsh
        run: Compress-Archive -Path '${{ env.app_package_name }}' -DestinationPath '${{ env.package }}'

      - name: Upload package to workflow artifacts
        if: ${{ env.is_platform_enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          path: tmp/app/${{ env.package }}
          name: package-${{ matrix.platform }}
          retention-days: 1

      - name: Upload web bundle to workflow artifacts for GitHub Pages (Web)
        if: ${{ env.is_platform_enabled == 'true' && matrix.platform == 'web' && (inputs.deploy_to_github_pages || (github.event_name == 'push' && needs.forward-env.outputs.deploy_gh_pages == 'true')) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.app }}

      - name: Upload package to GitHub release
        if: ${{ env.is_platform_enabled == 'true' && needs.forward-env.outputs.upload_to_github == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tmp/app/${{ env.package }}
          asset_name: ${{ env.package }}
          release_name: ${{ env.version }}
          tag: ${{ env.version }}
          overwrite: true

  # Deploy to itch.io
  deploy-to-itch:
    runs-on: ubuntu-latest
    needs:
      - forward-env
      - get-version
      - build
    if: ${{ needs.forward-env.outputs.itch != '' && (github.event_name != 'push' || needs.forward-env.outputs.deploy_itch == 'true') }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: tmp

      - name: Install butler
        run: |
          curl -L -o butler.zip 'https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default'
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Upload all packages to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          for package in $(ls tmp); do
            ./butler push \
              --fix-permissions \
              --userversion='${{ needs.get-version.outputs.version }}' \
              tmp/"${package}"/* \
              '${{ env.itch }}':"${package#package-}"
          done

# Deploy to GitHub Pages.
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    needs:
      - forward-env
      - build
    permissions:
      # Required to deploy to GitHub Pages.
      pages: write
      # Required for GitHub Pages to verify the source of the deployment
      # See: <https://github.com/actions/deploy-pages/issues/329>.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    if: ${{ (inputs.deploy_to_github_pages && inputs.build_web) || (github.event_name == 'push' && needs.forward-env.outputs.deploy_gh_pages == 'true') }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
